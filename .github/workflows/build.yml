# Génère les livrables à chaque modification de main et les fournit en artefact.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # igraph (via DiagrammeR) : glpk, libxml2 ; curl : libcurl ; rsvg : librsvg2
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libglpk-dev libxml2-dev libcurl4-openssl-dev librsvg2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Génération
        run: Rscript build.R
      - uses: actions/upload-artifact@v4
        with:
          name: boussole-lca
          path: _output/
